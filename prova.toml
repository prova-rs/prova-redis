# One manifest, two hats. In Prova a package is one prova.toml-rooted unit; this one both exports a
# namespace (a package — `[package]`) and runs its own proofs (a suite). Author the package in
# init.lua; prove it in proofs/; ship both together.
[package]
name        = "redis"
description = "Redis cache for Prova — docker-exec over redis-cli, zero native code"
license     = "MIT"

# The range of prova versions this package is built against; a consumer is checked against it.
[requires]
prova = ">= 0.16"

# Resolve THIS package from its own directory, so the self-tests can `require("redis")` exactly as
# a consumer would. A CONSUMER instead pins it by source — a released tag:
#   redis = { git = "https://github.com/prova-rs/prova-redis", tag = "v1" }
[packages]
redis = { path = "." }
